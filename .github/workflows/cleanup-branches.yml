name: Clean up merged branches

# Deletes the branches whose pull request was merged: right after a pull request is closed,
# and once a week for leftovers. Branches with an open pull request or never merged are kept.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          owner="${REPO%%/*}"
          default=$(gh api "repos/$REPO" --jq .default_branch)
          for branch in $(gh api "repos/$REPO/branches" --paginate --jq '.[].name'); do
            [ "$branch" = "$default" ] && continue
            open=$(gh api "repos/$REPO/pulls?state=open&head=$owner:$branch" --jq length)
            merged=$(gh api "repos/$REPO/pulls?state=closed&head=$owner:$branch" --jq '[.[] | select(.merged_at)] | length')
            if [ "$open" = "0" ] && [ "$merged" != "0" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null && echo "Deleted $branch" || echo "::warning::Could not delete $branch"
            else
              echo "Kept $branch (open PRs: $open, merged PRs: $merged)"
            fi
          done
